<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학교 주변 맛집 추천 🍽️</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --primary-hover: #ff5252;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-radius: 16px;
            --shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, 'Helvetica Neue', 'Segoe UI', 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 480px;
            padding: 32px 24px;
            text-align: center;
        }

        header h1 {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 8px;
        }

        header p {
            color: var(--text-muted);
            font-size: 0.95rem;
            margin-bottom: 24px;
        }

        /* 카테고리 필터 버튼 */
        .category-filter {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .category-btn {
            background-color: #e9ecef;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            color: #495057;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .category-btn.active {
            background-color: var(--primary-color);
            color: white;
        }

        /* 추천 버튼 */
        .recommend-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(255, 107, 107, 0.3);
            margin-bottom: 28px;
        }

        .recommend-btn:hover {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 16px rgba(255, 107, 107, 0.4);
        }

        .recommend-btn:active {
            transform: translateY(0);
        }

        /* 결과 카드 영역 */
        .result-card {
            background-color: #fdfdfd;
            border: 1px solid #edf2f7;
            border-radius: 12px;
            overflow: hidden;
            display: none;
            animation: fadeIn 0.4s ease-out forwards;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .restaurant-img-wrapper {
            position: relative;
            width: 100%;
            height: 220px;
            overflow: hidden;
            background-color: #e9ecef;
        }

        .restaurant-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .restaurant-category-badge {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: rgba(0, 0, 0, 0.6);
            color: white;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            backdrop-filter: blur(4px);
        }

        .restaurant-info {
            padding: 20px;
            text-align: left;
        }

        .restaurant-name {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 6px;
            color: #1a202c;
        }

        .restaurant-rating {
            color: #f6e05e;
            font-size: 0.95rem;
            margin-bottom: 12px;
        }

        .restaurant-desc {
            color: #4a5568;
            font-size: 0.9rem;
            line-height: 1.5;
            margin-bottom: 16px;
        }

        .restaurant-meta {
            font-size: 0.85rem;
            color: #718096;
            display: flex;
            flex-direction: column;
            gap: 6px;
            border-top: 1px dashed #e2e8f0;
            padding-top: 12px;
        }

        .placeholder-box {
            padding: 40px 20px;
            border: 2px dashed #cbd5e0;
            border-radius: 12px;
            color: #a0aec0;
        }

        .placeholder-icon {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>🎓 Campus Gourmet</h1>
            <p>오늘 뭐 먹지? 버튼을 눌러 맛집을 추천받으세요!</p>
        </header>

        <!-- 카테고리 필터 -->
        <div class="category-filter">
            <button class="category-btn active" onclick="filterCategory('전체')">전체</button>
            <button class="category-btn" onclick="filterCategory('한식')">한식</button>
            <button class="category-btn" onclick="filterCategory('일식')">일식</button>
            <button class="category-btn" onclick="filterCategory('양식')">양식</button>
            <button class="category-btn" onclick="filterCategory('분식')">분식</button>
        </div>

        <!-- 추천 버튼 -->
        <button class="recommend-btn" onclick="getRandomRestaurant()">🎲 랜덤 맛집 뽑기</button>

        <!-- 초기 안내 박스 -->
        <div id="placeholder" class="placeholder-box">
            <div class="placeholder-icon">🍱</div>
            <p>버튼을 누르면 학교 주변 맛집이 짜잔!</p>
        </div>

        <!-- 결과 카드 -->
        <div id="resultCard" class="result-card">
            <div class="restaurant-img-wrapper">
                <img id="restImg" class="restaurant-img" src="" alt="식당 이미지">
                <span id="restCategory" class="restaurant-category-badge">한식</span>
            </div>
            <div class="restaurant-info">
                <div id="restName" class="restaurant-name">식당 이름</div>
                <div id="restRating" class="restaurant-rating">★★★★☆</div>
                <p id="restDesc" class="restaurant-desc">설명이 여기에 들어갑니다.</p>
                <div class="restaurant-meta">
                    <div>📍 <span id="restLocation">위치 설명</span></div>
                    <div>💡 <span id="restMenu">대표 메뉴</span></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 학교 주변 식당 데이터 (여기서 자유롭게 추가/수정 가능)
        const restaurants = [
            {
                name: "할머니 가마솥 국밥",
                category: "한식",
                rating: "★★★★★ (4.8)",
                desc: "진한 사골 육수가 일품! 시험기간 밤샘 후 먹으면 속이 뻥 뚫리는 24시 국밥집.",
                location: "정문에서 도보 3분 (GS25 골목 안쪽)",
                menu: "돼지국밥, 순대국밥, 수육정식",
                image: "https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "스시 오마카세 멘짱",
                category: "일식",
                rating: "★★★★☆ (4.5)",
                desc: "가성비 최강의 초밥 & 라멘 전문점. 점심 특선 메뉴 세트 강력 추천!",
                location: "후문 먹자골목 중심가 2층",
                menu: "모둠초밥 세트, 돈코츠 라멘",
                image: "https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "캠퍼스 파스타 테라스",
                category: "양식",
                rating: "★★★★☆ (4.6)",
                desc: "분위기 좋은 데이트 & 모임 장소. 꾸덕한 매콤 크림 파스타가 시그니처!",
                location: "공과대학 건너편 카페거리",
                menu: "매콤 투움바 파스타, 고르곤졸라 피자",
                image: "https://images.unsplash.com/photo-1551183053-bf91a1d81141?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "청춘 떡볶이와 튀김",
                category: "분식",
                rating: "★★★★★ (4.9)",
                desc: "매콤달콤한 옛날 학교 앞 떡볶이 맛. 바삭한 모둠 튀김과의 조합은 필수가 아닐까?",
                location: "학생회관 옆 계단 아래",
                menu: "치즈 떡볶이, 모둠 튀김, 수제 순대",
                image: "https://images.unsplash.com/photo-1563245372-f21724e3856d?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "불타는 고기덮밥",
                category: "한식",
                rating: "★★★★☆ (4.4)",
                desc: "불향 가득한 직화 삼겹살 덮밥! 양도 푸짐해서 공강 시간에 든든하게 먹기 최고.",
                location: "쪽문 건너편 빌라촌 입구",
                menu: "직화 삼겹덮밥, 매운 닭갈비덮밥",
                image: "https://images.unsplash.com/photo-1543339308-43e59d6b73a6?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "도쿄 돈카츠 공방",
                category: "일식",
                rating: "★★★★★ (4.7)",
                desc: "겉은 바삭, 속은 촉촉한 겉바속촉 등심카츠! 와사비와 핑크솔트 찍어먹으면 예술.",
                location: "정문 버스정류장 뒤편",
                menu: "로스카츠 정식, 안심 히레카츠",
                image: "https://images.unsplash.com/photo-1553621042-f6e147245754?auto=format&fit=crop&w=800&q=80"
            },
            {
                name: "수제버거 크루",
                category: "양식",
                rating: "★★★★☆ (4.5)",
                desc: "육즙 터지는 두꺼운 육패티와 감자튀김의 환상 조화. 맥주 한 잔 곁들이기 좋은 곳.",
                location: "후문 로데오거리 중앙",
                menu: "더블 치즈버거, 갈릭 감자튀김",
                image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=800&q=80"
            }
        ];

        let currentCategory = "전체";

        // 카테고리 선택 기능
        function filterCategory(category) {
            currentCategory = category;
            
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => {
                if (btn.innerText === category) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // 랜덤 맛집 뽑기 기능
        function getRandomRestaurant() {
            let filteredList = restaurants;
            if (currentCategory !== "전체") {
                filteredList = restaurants.filter(item => item.category === currentCategory);
            }

            if (filteredList.length === 0) {
                alert("해당 카테고리의 맛집 정보가 없습니다!");
                return;
            }

            const randomIndex = Math.floor(Math.random() * filteredList.length);
            const selected = filteredList[randomIndex];

            document.getElementById('restImg').src = selected.image;
            document.getElementById('restCategory').innerText = selected.category;
            document.getElementById('restName').innerText = selected.name;
            document.getElementById('restRating').innerText = selected.rating;
            document.getElementById('restDesc').innerText = selected.desc;
            document.getElementById('restLocation').innerText = selected.location;
            document.getElementById('restMenu').innerText = selected.menu;

            document.getElementById('placeholder').style.display = 'none';
            const card = document.getElementById('resultCard');
            card.style.display = 'block';

            // 클릭 시 카드 애니메이션 재실행
            card.style.animation = 'none';
            card.offsetHeight;
            card.style.animation = 'fadeIn 0.4s ease-out forwards';
        }
    </script>
</body>
</html>
